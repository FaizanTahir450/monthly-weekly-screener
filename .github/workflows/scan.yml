name: Crypto Scan

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      universe:
        description: "Coin universe"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - top100
          - top200
          - top500
          - binance
          - bybit
          - okx
          - kucoin
          - gate
          - mexc
          - bitget
          - multi
          - multi-all
          - ai
          - gaming
          - rwa
          - meme
          - trending
          - recent
          - events
          - social
      alerts:
        description: "Send Telegram alerts"
        required: false
        default: true
        type: boolean

jobs:
  scan-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SCAN_UNIVERSE: ${{ inputs.universe }}
      SCAN_ALERTS: ${{ inputs.alerts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          if [ "$SCAN_ALERTS" = "true" ]; then
            npm run scan -- --universe="$SCAN_UNIVERSE" --alerts
          else
            npm run scan -- --universe="$SCAN_UNIVERSE"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MULTI_EXCHANGE_ALLOW_PARTIAL: "true"
          SCAN_PROGRESS_LOGS: "true"

  scan-scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        universe:
          - binance
          - bybit
          - okx
          - kucoin
          - gate
          - mexc
          - bitget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run scan -- --universe="${{ matrix.universe }}" --alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_PROGRESS_LOGS: "true"
